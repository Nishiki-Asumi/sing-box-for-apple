name: Build and Upload iOS IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box version to build (default: latest)'
        required: false
        default: 'latest'
        type: string
  push:
    branches:

jobs:
  build-ios-app:
    runs-on: macos-latest
    env:
      XCODEPROJ_NAME: sing-box
      APPLICATION_NAME: sing-box
      SCHEME_NAME: SFI
      XCODE_VERSION: "26.3"
      GO_VERSION: "1.25.9"
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Install ldid
        run: |
          brew install ldid

      - name: Select Xcode version
        run: |
          sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
          # xcodebuild -downloadPlatform iOS

      - name: Get sing-box version
        id: get_version
        run: |
          set -Eeuox pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" == "latest" ]; then
            VERSION=$(curl -s --header "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
          fi
          if [ "$VERSION" == "null" ]; then
            echo "Failed to get the latest version. Please specify a version."
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Cache Libbox.xcframework
        id: cache-libbox
        uses: actions/cache@v5
        with:
          path: Libbox.xcframework
          key: libbox-${{ steps.get_version.outputs.version }}-go${{ env.GO_VERSION }}
      - name: Setup Go
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Libbox.xcframework
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          set -Eeuox pipefail

          BUILD_DIR=$(mktemp -d)
          cd $BUILD_DIR
          git clone --branch ${{ steps.get_version.outputs.version }} --depth 1 https://github.com/SagerNet/sing-box box
          cd box
          make lib_install
          gomobile init
          go run ./cmd/internal/build_libbox -target apple -platform ios,iossimulator
          cp -R Libbox.xcframework $GITHUB_WORKSPACE/
          cd $GITHUB_WORKSPACE
          rm -rf $BUILD_DIR

      - name: Cache Xcode build
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ hashFiles('**/*.swift', '**/*.pbxproj') }}
          restore-keys: |
            xcode-deriveddata-${{ runner.os }}-

      - name: iOS build
        run: |
          set -Eeuox pipefail

          XCODEPROJ_NAME=sing-box
          APPLICATION_NAME=sing-box
          SCHEME_NAME=SFI

          xcodebuild -project $XCODEPROJ_NAME.xcodeproj -scheme $SCHEME_NAME -destination generic/platform=iOS -configuration Release -sdk iphoneos build install STRIP_INSTALLED_PRODUCT=NO ARCHS=arm64 CODE_SIGNING_ALLOWED=NO ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO ENABLE_BITCODE=NO DSTROOT=packages/

          ldid -SSFI/SFI.entitlements packages/Applications/$APPLICATION_NAME.app/$APPLICATION_NAME
          ldid -SExtension/Extension.entitlements packages/Applications/$APPLICATION_NAME.app/PlugIns/Extension.appex/Extension
          ldid -SIntentsExtension/IntentsExtension.entitlements packages/Applications/$APPLICATION_NAME.app/Extensions/IntentsExtension.appex/IntentsExtension

          mkdir -p packages/Payload
          cp -rp packages/Applications/$APPLICATION_NAME.app packages/Payload
          cd packages
          zip -qr $APPLICATION_NAME.ipa Payload
          rm -r Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-ipa
          path: packages/sing-box.ipa
          archive: false
          if-no-files-found: error
